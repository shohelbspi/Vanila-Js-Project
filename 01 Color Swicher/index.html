<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="heading"> Welcome to Color Changer App</h1>
        
        <div class="inputContainer">
            <button class="randomBtn">Random Color</button>
            <input id="colorInput" type="text" placeholder="Enter a Color or Hex (e.g : tomato or #ffffff)">
            <button class="applyBtn">Apply Color</button>
        
        </div>
        
        <h2 class="currentColor">Current Color : <span class="currentColorValue">green</span></h2>
    </div>

    <script src="script.js"></script>    
</body>
</html>
